version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: intent_audit_db
    restart: always
    environment:
      # Allows the root user to have an empty password as required by your script
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      # Automatically creates the database your script is looking for
      MYSQL_DATABASE: intent_audit
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: